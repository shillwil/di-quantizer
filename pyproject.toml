[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "di-quantizer"
version = "0.1.0"
description = "CLI tool for quantizing DI guitar transients to grid — because Flex Time sucks at guitar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alex" }
]
keywords = ["audio", "guitar", "quantize", "transient", "music-production", "logic-pro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]
dependencies = [
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
diq = "di_quantizer.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/di_quantizer"]
